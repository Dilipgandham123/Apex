services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: driving_school
      POSTGRES_USER: driving_school
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "5432:5432"
    volumes:
      - driving-school-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driving_school -d driving_school"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  driving-school-postgres:
